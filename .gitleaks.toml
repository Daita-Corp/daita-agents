title = "Daita public repository secret scanning"
minVersion = "8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic sentinel values and environment-variable names in tests"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)tests/.*\.py$''']
regexes = [
  '''["'](?:XLSX_ROW_SECRET|ROW_SECRET)_[0-9A-Fa-f]{6,8}["']''',
  '''["']CLARIFICATION_(?:EAST|WEST)_[0-9A-F]{6}["']''',
  '''["']STAGE_[A-Z0-9_]+_SENTINEL_[0-9A-F]{6}["']''',
  '''["']PHASE4_(?:SINGLE|PARTITIONS|RECOVERY|SECURITY|TRUNCATION)_[0-9A-F]{6}["']''',
  '''["']DAITA_STAGE[A-Z0-9_]*_LIVE_LLM_API_KEY["']''',
  '''["'](?:super_secret|sk-1234567890)["']''',
]
