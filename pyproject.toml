[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daita-agents"
version = "1.0.0"
description = "A transcript driven data agent"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{name = "Daita", email = "support@daita-tech.io"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "openai>=1.99.9,<2.0.0",
    "anthropic>=0.116.0,<1.0.0",
    "google-genai>=1.73.1,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "sqlglot>=30.14.0,<30.15.0",
    "keyring>=25.0.0,<26.0.0",
    "prompt-toolkit>=3.0.52,<4.0.0",
    "rich>=15.0.0,<16.0.0",
    "XlsxWriter>=3.2.5,<4.0.0",
]

[project.scripts]
daita = "daita.cli:main"

[project.optional-dependencies]
dev = [
    "black>=26.1.0",
    "build>=1.2.2",
    "mypy>=1.15.0",
    "openpyxl>=3.1.0,<4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.26.0",
    "wheel>=0.45.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["daita*"]

[tool.setuptools.package-data]
"daita.llm" = ["pricing_schedules.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--tb=short -q"
markers = [
    "unit: fast isolated tests",
    "contract: portable contract tests",
    "integration: local component integration tests",
    "acceptance: black-box public behavior tests",
    "requires_llm: requires live model credentials",
    "requires_db: requires an external database",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pyright]
include = ["src/daita", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnusedImport = "error"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
