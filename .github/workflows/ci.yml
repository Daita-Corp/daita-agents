name: Daita CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  deterministic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/ -m "not requires_llm and not requires_db"

  pipx-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]" pipx
      - run: python -m build --wheel --outdir dist
      - name: Exercise the same candidate wheel through managed and pipx lifecycles
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          candidate="$(pwd)/${wheels[0]}"
          python tests/managed_installer_lifecycle_smoke.py --candidate-wheel "$candidate"
          python tests/pipx_lifecycle_smoke.py --candidate-wheel "$candidate"

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m black --check src tests
      - run: python -m ruff check --select I .
      - run: python -m mypy src/daita tests
      - run: bash -n scripts/install.sh
      - run: shellcheck scripts/install.sh
