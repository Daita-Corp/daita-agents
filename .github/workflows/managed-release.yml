name: Daita managed release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified tag after its exact wheel is on PyPI
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: managed-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      wheel: ${{ steps.artifact.outputs.wheel }}
      mode: ${{ steps.identity.outputs.mode }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore exact annotated tag reference after checkout
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch --force --no-tags origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" pipx
      - id: identity
        name: Validate project, tag, and checkout identity
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish || false }}
        shell: bash
        run: |
          version="$(python scripts/release_identity.py project-version)"
          tag="$(python scripts/release_identity.py project-tag)"
          mode=branch
          if [[ "$PUBLISH_REQUESTED" == "true" ]]; then
            test "$GITHUB_REF_TYPE" = "tag"
            mode=protected
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            mode=candidate
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "$tag"
            test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag"
            test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "mode=$mode"
            echo "source_date_epoch=$(git show -s --format=%ct HEAD)"
          } >> "$GITHUB_OUTPUT"
      - name: Collect complete GitHub and PyPI published-version evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$RUNNER_TEMP/github-release-pages.json"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --retry 10 --retry-all-errors --retry-delay 3 \
            --output "$RUNNER_TEMP/pypi-project.json" \
            "https://pypi.org/pypi/daita-agents/json"
          python - \
            "$RUNNER_TEMP/github-release-pages.json" \
            "$RUNNER_TEMP/pypi-project.json" \
            "$RUNNER_TEMP/prior-versions.txt" \
            "${{ steps.identity.outputs.version }}" \
            "${{ steps.identity.outputs.tag }}" \
            "${{ steps.identity.outputs.mode }}" \
            "${{ github.ref_type }}" <<'PY'
          import json
          import sys

          from scripts.release_identity import (
              parse_published_version_evidence,
              prior_versions_for_mode,
          )

          github_path, pypi_path, output_path, candidate, tag, mode, ref_type = sys.argv[1:]
          github_pages = json.load(open(github_path, encoding="utf-8"))
          pypi = json.load(open(pypi_path, encoding="utf-8"))
          evidence = parse_published_version_evidence(github_pages, pypi)
          ordered = prior_versions_for_mode(
              evidence,
              candidate=candidate,
              tag=tag,
              mode=mode,
              tagged=ref_type == "tag",
          )
          with open(output_path, "w", encoding="utf-8") as output:
              for value in ordered:
                  output.write(value + "\n")
          PY
      - name: Admit candidate before building
        if: steps.identity.outputs.mode != 'branch' || github.ref_type == 'tag'
        run: |
          python scripts/release_identity.py require-newer \
            --candidate "${{ steps.identity.outputs.version }}" \
            --previous-file "$RUNNER_TEMP/prior-versions.txt"
      - name: Verify the candidate agent-home release contract
        shell: bash
        run: |
          python scripts/check_home_release_contract.py check
          previous_ref=""
          while IFS= read -r ref; do
            if [[ "$GITHUB_REF_TYPE" == "tag" && "$ref" == "$GITHUB_REF_NAME" ]]; then
              continue
            fi
            if git cat-file -e "$ref:release/agent-home-contract.json" 2>/dev/null; then
              previous_ref="$ref"
              break
            fi
          done < <(git tag --merged HEAD --sort=-version:refname --list 'v*')
          if [[ -z "$previous_ref" ]]; then
            echo "No prior tagged agent-home snapshot exists; this release establishes the baseline."
          else
            prior="$RUNNER_TEMP/tagged-agent-home-contract.json"
            git show "$previous_ref:release/agent-home-contract.json" > "$prior"
            python scripts/check_home_release_contract.py compare --base "$prior"
          fi
      - id: artifact
        name: Build and inspect the candidate wheel once
        env:
          SOURCE_DATE_EPOCH: ${{ steps.identity.outputs.source_date_epoch }}
        shell: bash
        run: |
          python -m build --wheel --outdir release-artifacts
          shopt -s nullglob
          wheels=(release-artifacts/*.whl)
          test "${#wheels[@]}" -eq 1
          candidate="${wheels[0]}"
          wheel="$(basename "$candidate")"
          inspected="$(python -c 'import pathlib, sys; from scripts.render_managed_installer import inspect_wheel; print(inspect_wheel(pathlib.Path(sys.argv[1])).version)' "$candidate")"
          test "$inspected" = "${{ steps.identity.outputs.version }}"
          test "$wheel" = "daita_agents-${inspected}-py3-none-any.whl"
          echo "wheel=$wheel" >> "$GITHUB_OUTPUT"
      - name: Render immutable installer and release evidence twice
        shell: bash
        run: |
          candidate="release-artifacts/${{ steps.artifact.outputs.wheel }}"
          url="https://github.com/Daita-Corp/daita-agents/releases/download/${{ steps.identity.outputs.tag }}/${{ steps.artifact.outputs.wheel }}"
          python scripts/render_managed_installer.py \
            --wheel "$candidate" --wheel-url "$url" \
            --installer-output release-artifacts/install.sh \
            --manifest-output release-artifacts/release-manifest.json
          python scripts/render_managed_installer.py \
            --wheel "$candidate" --wheel-url "$url" \
            --installer-output "$RUNNER_TEMP/install.sh" \
            --manifest-output "$RUNNER_TEMP/release-manifest.json"
          cmp release-artifacts/install.sh "$RUNNER_TEMP/install.sh"
          cmp release-artifacts/release-manifest.json "$RUNNER_TEMP/release-manifest.json"
          bash -n release-artifacts/install.sh
          shellcheck release-artifacts/install.sh
          release-artifacts/install.sh --version
          release-artifacts/install.sh --dry-run --no-onboard --no-modify-path
      - name: Attach the verified agent-home contract snapshot
        run: |
          install -m 0644 \
            release/agent-home-contract.json \
            release-artifacts/agent-home-contract.json
      - name: Verify the once-built wheel through local managed and pipx lifecycles
        shell: bash
        run: |
          candidate="$(pwd)/release-artifacts/${{ steps.artifact.outputs.wheel }}"
          python -m tests.packaging.managed_installer_lifecycle_smoke --candidate-wheel "$candidate"
          python -m tests.packaging.pipx_lifecycle_smoke --candidate-wheel "$candidate"
      - name: Record release checksums
        working-directory: release-artifacts
        shell: bash
        run: |
          sha256sum \
            "${{ steps.artifact.outputs.wheel }}" \
            install.sh \
            release-manifest.json \
            agent-home-contract.json \
            > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: managed-release
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  deterministic-and-static:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: managed-release
          path: release-artifacts
      - name: Install the exact producer wheel with verification dependencies
        run: |
          python -m pip install \
            "$(pwd)/release-artifacts/${{ needs.build.outputs.wheel }}[dev]"
      - name: Validate GitHub Actions workflow syntax
        shell: bash
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo \
            rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -ignore 'label "macos-15-intel" is unknown'
      - name: Run deterministic and static release gates
        env:
          DAITA_TEST_CANDIDATE_WHEEL: ${{ github.workspace }}/release-artifacts/${{ needs.build.outputs.wheel }}
        run: |
          python -m pytest tests/ -m "not requires_llm and not requires_db and not requires_network and not slow"
          python -m black --check src tests scripts
          python -m ruff check --select I .
          python -m mypy src/daita tests
          bash -n release-artifacts/install.sh
          bash -n scripts/bootstrap_managed_installer_host.sh
          shellcheck release-artifacts/install.sh
          shellcheck scripts/bootstrap_managed_installer_host.sh
      - name: Scan the release source and complete history without exposing matches
        shell: bash
        run: |
          image="zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"
          source="$RUNNER_TEMP/gitleaks-source"
          mkdir -p "$source"
          git archive --format=tar --output="$RUNNER_TEMP/source.tar" HEAD
          tar -xf "$RUNNER_TEMP/source.tar" -C "$source"
          docker run --rm --volume "$source:/repo:ro" "$image" \
            dir /repo --config /repo/.gitleaks.toml --redact --no-banner
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro" "$image" \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner \
            --log-opts="--all"

  native-installer-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
          - target: linux-arm64-glibc
            runner: ubuntu-24.04-arm
          - target: linux-x86_64-glibc
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: managed-release
          path: release-artifacts
      - id: runtime
        name: Resolve the reviewed target policy
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          python - "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          import sys

          policy = json.load(open("release/managed-installer.json", encoding="utf-8"))
          runtime = policy["runtime"]
          values = {
              "uv_version": runtime["uv_version"],
              "python_request": runtime["python_request"],
              **runtime["targets"][os.environ["TARGET"]],
          }
          with open(sys.argv[1], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          PY
      - name: Verify official uv bootstrap archive
        shell: bash
        run: |
          archive="$RUNNER_TEMP/${{ steps.runtime.outputs.uv_archive }}"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors \
            --output "$archive" \
            "${{ steps.runtime.outputs.uv_url }}"
          actual="$(python -c 'import hashlib, pathlib, sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "$archive")"
          test "$actual" = "${{ steps.runtime.outputs.uv_sha256 }}"
      - name: Exercise exact built artifact on ${{ matrix.target }}
        shell: bash
        run: |
          python -m tests.packaging.managed_installer_lifecycle_smoke \
            --candidate-wheel "$(pwd)/release-artifacts/${{ needs.build.outputs.wheel }}" \
            --real-uv-archive "$RUNNER_TEMP/${{ steps.runtime.outputs.uv_archive }}" \
            --real-uv-version "${{ steps.runtime.outputs.uv_version }}" \
            --real-uv-member "${{ steps.runtime.outputs.uv_member }}" \
            --real-python-request "${{ steps.runtime.outputs.python_request }}" \
            --real-python-identity "${{ steps.runtime.outputs.python_identity }}"

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref_type == 'tag'
    needs:
      - build
      - deterministic-and-static
      - native-installer-smoke
    runs-on: ubuntu-24.04
    concurrency:
      group: managed-installer-stable
      cancel-in-progress: false
    environment: managed-installer-release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore exact annotated tag reference after checkout
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch --force --no-tags origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: managed-release
          path: release-artifacts
      - name: Verify propagated project, tag, wheel, and manifest identity
        shell: bash
        run: |
          project_version="$(python scripts/release_identity.py project-version)"
          project_tag="$(python scripts/release_identity.py project-tag)"
          test "$project_version" = "${{ needs.build.outputs.version }}"
          test "$project_tag" = "$GITHUB_REF_NAME"
          python - \
            release-artifacts/release-manifest.json \
            "$project_version" \
            "${{ needs.build.outputs.wheel }}" <<'PY'
          import json
          import sys

          path, version, wheel = sys.argv[1:]
          manifest = json.load(open(path, encoding="utf-8"))
          if manifest.get("application", {}).get("version") != version:
              raise SystemExit("manifest application version does not match the project")
          if manifest.get("wheel", {}).get("filename") != wheel:
              raise SystemExit("manifest wheel filename does not match the build")
          PY
      - name: Repeat complete protected published-version admission
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$RUNNER_TEMP/final-github-release-pages.json"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --retry 10 --retry-all-errors --retry-delay 3 \
            --output "$RUNNER_TEMP/final-pypi-project.json" \
            "https://pypi.org/pypi/daita-agents/json"
          python - \
            "$RUNNER_TEMP/final-github-release-pages.json" \
            "$RUNNER_TEMP/final-pypi-project.json" \
            "$RUNNER_TEMP/final-prior-versions.txt" \
            "${{ needs.build.outputs.version }}" \
            "$GITHUB_REF_NAME" <<'PY'
          import json
          import sys

          from scripts.release_identity import (
              parse_published_version_evidence,
              prior_versions_for_mode,
          )

          github_path, pypi_path, output_path, candidate, tag = sys.argv[1:]
          github_pages = json.load(open(github_path, encoding="utf-8"))
          pypi = json.load(open(pypi_path, encoding="utf-8"))
          evidence = parse_published_version_evidence(github_pages, pypi)
          ordered = prior_versions_for_mode(
              evidence, candidate=candidate, tag=tag, mode="protected"
          )
          with open(output_path, "w", encoding="utf-8") as output:
              for value in ordered:
                  output.write(value + "\n")
          PY
          python scripts/release_identity.py require-newer \
            --candidate "${{ needs.build.outputs.version }}" \
            --previous-file "$RUNNER_TEMP/final-prior-versions.txt"
      - name: Require the exact public PyPI wheel
        env:
          VERSION: ${{ needs.build.outputs.version }}
          WHEEL: ${{ needs.build.outputs.wheel }}
        shell: bash
        run: |
          cd release-artifacts
          sha256sum --check SHA256SUMS
          expected="$(sha256sum "$WHEEL" | cut -d' ' -f1)"
          response="$RUNNER_TEMP/pypi-release.json"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --retry 10 --retry-all-errors --retry-delay 3 \
            --output "$response" \
            "https://pypi.org/pypi/daita-agents/$VERSION/json"
          python - "$response" "$VERSION" "$WHEEL" "$expected" <<'PY'
          import json
          import sys

          response, version, wheel, expected = sys.argv[1:]
          document = json.load(open(response, encoding="utf-8"))
          if document.get("info", {}).get("version") != version:
              raise SystemExit("PyPI returned the wrong release version")
          files = document.get("urls", [])
          if len(files) != 1 or files[0].get("filename") != wheel:
              raise SystemExit("PyPI does not contain exactly the expected wheel")
          actual = files[0].get("digests", {}).get("sha256")
          if actual != expected:
              raise SystemExit("PyPI wheel SHA-256 does not match the release artifact")
          PY
      - name: Attest exact release artifacts
        uses: actions/attest-build-provenance@62fc1d596301d0ab9914e1fec14dc5c8d93f65cd # v3.2.0
        with:
          subject-path: |
            release-artifacts/${{ needs.build.outputs.wheel }}
            release-artifacts/install.sh
            release-artifacts/release-manifest.json
            release-artifacts/agent-home-contract.json
            release-artifacts/SHA256SUMS
      - name: Revalidate the remote annotated tag before draft creation
        shell: bash
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag"
          remote_tag_object="$(
            git ls-remote --refs --exit-code origin "refs/tags/$GITHUB_REF_NAME" |
              cut -f1
          )"
          test "$remote_tag_object" = "$(git rev-parse "$GITHUB_REF_NAME")"
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
      - name: Create draft release with exact assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release-artifacts/${{ needs.build.outputs.wheel }}" \
            "release-artifacts/install.sh" \
            "release-artifacts/release-manifest.json" \
            "release-artifacts/agent-home-contract.json" \
            "release-artifacts/SHA256SUMS" \
            --draft \
            --verify-tag \
            --title "Daita ${{ needs.build.outputs.version }}" \
            --generate-notes
      - name: Verify draft assets before immutable publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          draft="$RUNNER_TEMP/daita-draft-release"
          install -d -m 0755 "$draft"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --dir "$draft"
          python - "$draft" "${{ needs.build.outputs.wheel }}" <<'PY'
          import pathlib
          import sys

          directory = pathlib.Path(sys.argv[1])
          expected = {
              sys.argv[2],
              "install.sh",
              "release-manifest.json",
              "agent-home-contract.json",
              "SHA256SUMS",
          }
          actual = {entry.name for entry in directory.iterdir()}
          if actual != expected or any(not entry.is_file() for entry in directory.iterdir()):
              raise SystemExit("draft release does not contain the exact artifact set")
          PY
          for artifact in \
            "${{ needs.build.outputs.wheel }}" \
            install.sh \
            release-manifest.json \
            agent-home-contract.json \
            SHA256SUMS; do
            cmp "release-artifacts/$artifact" "$draft/$artifact"
          done
      - name: Publish immutable versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          remote_tag_object="$(
            git ls-remote --refs --exit-code origin "refs/tags/$GITHUB_REF_NAME" |
              cut -f1
          )"
          test "$remote_tag_object" = "$(git rev-parse "$GITHUB_REF_NAME")"
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --draft=false --verify-tag
      - name: Verify published bytes
        shell: bash
        run: |
          base="https://github.com/Daita-Corp/daita-agents/releases/download/$GITHUB_REF_NAME"
          for artifact in \
            "${{ needs.build.outputs.wheel }}" \
            install.sh \
            release-manifest.json \
            agent-home-contract.json \
            SHA256SUMS; do
            curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 \
              --retry 5 --retry-all-errors \
              --output "$RUNNER_TEMP/$artifact" "$base/$artifact"
            cmp "release-artifacts/$artifact" "$RUNNER_TEMP/$artifact"
          done
      - name: Verify published artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release verify "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          for artifact in \
            "${{ needs.build.outputs.wheel }}" \
            install.sh \
            release-manifest.json \
            agent-home-contract.json \
            SHA256SUMS; do
            gh attestation verify "release-artifacts/$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/managed-release.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
      - name: Validate installer before admitting deployment credentials
        shell: bash
        run: |
          python scripts/request_managed_installer_promotion.py validate \
            --tag "$GITHUB_REF_NAME" \
            --artifacts release-artifacts
      - name: Request atomic stable installer promotion
        env:
          DEPLOY_HOST: ${{ secrets.MANAGED_INSTALLER_SSH_HOST }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.MANAGED_INSTALLER_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.MANAGED_INSTALLER_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          credentials="$(mktemp -d "$RUNNER_TEMP/managed-installer-ssh.XXXXXX")"
          trap 'rm -rf -- "$credentials"' EXIT
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$credentials/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$credentials/known_hosts"
          chmod 0600 "$credentials/id_ed25519" "$credentials/known_hosts"
          unset DEPLOY_PRIVATE_KEY DEPLOY_KNOWN_HOSTS
          python scripts/request_managed_installer_promotion.py promote \
            --tag "$GITHUB_REF_NAME" \
            --artifacts release-artifacts \
            --host "$DEPLOY_HOST" \
            --user daita-installer-deploy \
            --identity-file "$credentials/id_ed25519" \
            --known-hosts-file "$credentials/known_hosts"
      - name: Verify stable installer from public endpoint
        shell: bash
        run: |
          python scripts/request_managed_installer_promotion.py verify \
            --tag "$GITHUB_REF_NAME" \
            --artifacts release-artifacts
