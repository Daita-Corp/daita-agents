[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daita-agents"
version = "2.0.0a0"
description = "Isolated Daita autonomous-agent v2 replacement candidate"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Daita", email = "support@daita-tech.io"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
daita = "daita.cli:main"

[project.optional-dependencies]
anthropic = ["anthropic>=0.116.0"]
google = ["google-genai>=1.73.1"]
keychain = ["keyring>=25.0.0"]
openai = ["openai>=1.99.9"]
postgresql = ["asyncpg>=0.30.0", "sqlglot>=25.0.0"]
sqlite = ["sqlglot>=25.0.0"]

# Supported runtime bundles. Local CLI, memory, and production-host behavior
# use only the dependency-free core; their extras remain explicit feature
# markers without pulling deferred v1 integrations back into the candidate.
llm-all = [
    "openai>=1.99.9",
    "anthropic>=0.116.0",
    "google-genai>=1.73.1",
]
data = [
    "asyncpg>=0.30.0",
    "sqlglot>=25.0.0",
]
cli = []
memory = []
production = []
recommended = [
    "openai>=1.99.9",
    "sqlglot>=25.0.0",
    "keyring>=25.0.0",
]
complete = [
    "openai>=1.99.9",
    "anthropic>=0.116.0",
    "google-genai>=1.73.1",
    "asyncpg>=0.30.0",
    "sqlglot>=25.0.0",
    "keyring>=25.0.0",
]
all = [
    "openai>=1.99.9",
    "anthropic>=0.116.0",
    "google-genai>=1.73.1",
    "asyncpg>=0.30.0",
    "sqlglot>=25.0.0",
    "keyring>=25.0.0",
]

dev = [
    "black>=26.1.0",
    "build>=1.2.2",
    "mypy>=1.15.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.26.0",
    "wheel>=0.45.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["daita*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--tb=short -q"
markers = [
    "unit: fast isolated tests",
    "contract: portable contract tests",
    "integration: local component integration tests",
    "acceptance: black-box public behavior tests",
    "performance: performance and reliability tests",
    "live_mvp: outcome-first real-provider MVP benchmark rows",
    "live_mvp_smoke: four canonical direct-prompt MVP benchmark rows",
    "live_mvp_reliability: eight MVP prompt-paraphrase reliability rows",
    "live_precutover: retained session compression and cold-reopen stress rows",
    "requires_llm: requires live model credentials",
    "requires_db: requires an external database",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pyright]
include = ["src/daita", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnusedImport = "error"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
