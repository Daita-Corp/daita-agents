name: daita-postgresql-fixture

services:
  postgres:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_DB: daita_fixture
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fixture_admin_password
    ports:
      - "127.0.0.1:${DAITA_FIXTURE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/001-daita-fixture.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d daita_fixture"]
      interval: 1s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
