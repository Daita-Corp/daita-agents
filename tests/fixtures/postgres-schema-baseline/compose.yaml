name: daita-postgres-schema-baseline

# Empty disposable server; the harness applies seed.sql itself on every run.
services:
  postgres:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_DB: daita_schema_baseline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fixture_admin_password
    ports:
      - "127.0.0.1:${DAITA_SCHEMA_BASELINE_POSTGRES_PORT:-55434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d daita_schema_baseline"]
      interval: 1s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
